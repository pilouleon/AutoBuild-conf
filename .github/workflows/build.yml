name: Tests et installeurs

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier une pré-version GitHub avec les installeurs'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix templates/socle ci
      - run: npm run typecheck
      - run: npm test
      - name: Démo de bout en bout (scénario, sans clé API)
        run: npm run demo:headless -- --vitesse 40

  installeurs:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Windows
            os: windows-latest
            cible: --win --x64
            intel: false
          - nom: Mac-Apple-Silicon
            os: macos-latest
            cible: --mac --arm64
            intel: false
          # Mac Intel : construit sur le runner Apple Silicon ; seuls les binaires EMBARQUÉS
          # (agent Claude, dépendances du template) sont pris en version x64.
          - nom: Mac-Intel
            os: macos-latest
            cible: --mac --x64
            intel: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build de l'application avec les outils natifs du runner, AVANT d'ajouter des binaires x64.
      - run: npm run build
      - name: Binaire de l'agent Claude pour Mac Intel
        if: matrix.intel
        run: npm install --no-save --force --os=darwin --cpu=x64 "@anthropic-ai/claude-agent-sdk-darwin-x64@$(node -p "require('@anthropic-ai/claude-agent-sdk/package.json').version")"
      # Dépendances du template pour la plateforme cible (binaires natifs de Tailwind, Vite, TypeScript).
      - run: npm --prefix templates/socle ci ${{ matrix.intel && '--cpu=x64' || '' }}
      - run: npx electron-builder ${{ matrix.cible }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBuild-${{ matrix.nom }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  publication:
    needs: installeurs
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.publier) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installeurs
          merge-multiple: true
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-test.{1}', steps.v.outputs.version, github.run_number) }}
          name: AutoBuild ${{ steps.v.outputs.version }} (version de test ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: docs/notes-version.md
          files: installeurs/*
          fail_on_unmatched_files: false
